services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: slurtracker
      POSTGRES_USER: slurtracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slurtracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  classifier:
    build: ./slurs2-classifier
    ports:
      - "8000:8000"

  backend:
    build: ./slurs2-backend
    ports:
    - "5117:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=db;Database=slurtracker;Username=slurtracker;Password=${POSTGRES_PASSWORD}"
      LogsKey: ${LOGS_API_KEY}
      SteamApiKey: ${STEAM_API_KEY}
      ClassifierUrl: "http://classifier:8000"
    depends_on:
      db:
        condition: service_healthy
      classifier:
        condition: service_started

  frontend:
    build: ./slurs2-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data: